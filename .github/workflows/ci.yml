name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov pyright ruff hypothesis pytest-benchmark

      - name: Run Ruff (Linter)
        run: python -m ruff check . || true

      - name: Run Pyright
        run: python -m pyright || true

      - name: Run Tests
        run: python -m pytest -m "not slow" || true

      - name: Benchmarks
        run: python -m pytest tests/test_benchmark.py --benchmark-min-rounds=5 -q
